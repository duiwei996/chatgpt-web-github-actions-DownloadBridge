name: DownloadBridge 本地传输探针

on:
  push:
    paths:
      - .github/workflows/bridge-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成探针文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          printf 'DownloadBridge probe\nrun_id=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > payload/probe.txt
          sha256sum payload/probe.txt > payload/SHA256SUMS.txt

      - name: 上传探针 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-probe
          path: payload/
          if-no-files-found: error
          retention-days: 1

      - name: 记录运行 ID
        shell: bash
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > last_probe_run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last_probe_run.json
          git commit -m 'chore: record bridge probe run' || exit 0
          git push
